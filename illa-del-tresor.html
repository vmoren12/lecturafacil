<title>L’illa del tresor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: an open book. Each sentence is one row across both pages, so the original and its translation always sit on the same line. */
:root {
  --bg: #e7ecea;
  --page: #fbfcfa;
  --fold: #d9e0dd;
  --ink: #1d2a31;
  --muted: #62727a;
  --line: #d3dbd8;
  --accent: #1f6670;
  --accent-ink: #ffffff;
  --mark: #f3e3a0;
  --mark-soft: #f8efc9;
  --speak: #cfe6e3;
  --shadow: 0 1px 2px rgba(25,40,45,.06), 0 12px 32px rgba(25,40,45,.10);
  --f-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
  --f-display: "Literata", "Georgia", serif;
  --f-ur: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", "Noto Naskh Arabic", serif;
  --fs: 21px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171b; --page: #172228; --fold: #0c1316; --ink: #e2eaec; --muted: #94a6ad;
    --line: #2a3a41; --accent: #70c2c7; --accent-ink: #0f171b; --mark: #5a4f22; --mark-soft: #3a3520;
    --speak: #1f4a4c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171b; --page: #172228; --fold: #0c1316; --ink: #e2eaec; --muted: #94a6ad;
  --line: #2a3a41; --accent: #70c2c7; --accent-ink: #0f171b; --mark: #5a4f22; --mark-soft: #3a3520;
  --speak: #1f4a4c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- Top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: -.01em; line-height: 1.2; }
.brand span { font-size: 12.5px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl > label, .ctl > .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.ctl > .lbl i { font-style: normal; text-transform: none; letter-spacing: 0; opacity: .8; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--page); }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button .ur { font-family: var(--f-ur); font-size: 14px; line-height: 1; }
select { max-width: 240px; font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--page); color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--page); border-radius: 8px; padding: 6px 11px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn svg { width: 16px; height: 16px; flex: none; }

/* ---------- Book ---------- */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 40px; }
.book { max-width: 1160px; margin: 0 auto; }
.spread {
  position: relative; border-radius: 6px; box-shadow: var(--shadow);
  background:
    linear-gradient(to right, transparent calc(50% - 26px), rgba(0,0,0,.035) calc(50% - 1px), var(--fold) 50%, rgba(0,0,0,.035) calc(50% + 1px), transparent calc(50% + 26px)),
    var(--page);
  padding-block: 40px 22px; min-height: 62vh; display: flex; flex-direction: column;
}
.rows { flex: 1; }
.row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); position: relative; }
.cell { padding: 7px 44px 7px 56px; position: relative; transition: background-color .15s; min-width: 0; }
.cell.tr { padding: 7px 56px 7px 44px; }
.row:hover .cell, .row.active .cell { background: var(--mark-soft); }
.row:hover .cell.ca, .row.active .cell.ca { box-shadow: inset 3px 0 0 var(--mark); }
.row.speaking .cell { background: var(--speak); }
.ca .txt { font-size: var(--fs); line-height: 1.6; }
.tr .en { font-size: calc(var(--fs) * .92); line-height: 1.55; color: var(--ink); }
.tr .ur { font-family: var(--f-ur); direction: rtl; text-align: right; font-size: calc(var(--fs) * .98); line-height: 2.25; }
.tr .en + .ur { margin-top: 2px; color: var(--muted); }
.mode-ur .tr .ur { color: var(--ink); }
.hide-tr .row:not(:hover):not(.active) .tr > div { filter: blur(7px); opacity: .55; user-select: none; }
.hide-tr .tr > div { transition: filter .2s, opacity .2s; }

.w { cursor: pointer; border-radius: 3px; padding: 0 1px; margin: 0 -1px; }
.w:hover { background: var(--mark); }
.w.k { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-style: dotted; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.w.on { background: var(--accent); color: var(--accent-ink); }
.w.saved { text-decoration: underline; text-decoration-style: solid; text-decoration-color: var(--accent); text-underline-offset: 4px; text-decoration-thickness: 2px; }

.say { position: absolute; left: 16px; top: 11px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.say svg { width: 15px; height: 15px; }
.row:hover .say, .row.active .say, .say:focus-visible { opacity: 1; }
.say:hover { border-color: var(--line); color: var(--accent); }

.chead { padding-bottom: 18px; }
.chead .cell { padding-top: 0; padding-bottom: 0; }
.row.chead:hover .cell { background: transparent; box-shadow: none; }
.chead .num { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.chead h2 { font-family: var(--f-display); font-weight: 600; font-size: calc(var(--fs) * 1.6); line-height: 1.2; margin: 4px 0 0; text-wrap: balance; letter-spacing: -.01em; }
.chead .ur-t { font-family: var(--f-ur); direction: rtl; text-align: right; font-size: calc(var(--fs) * 1.25); line-height: 2.1; color: var(--muted); }
.chead .en-t { font-family: var(--f-display); font-size: calc(var(--fs) * 1.3); font-weight: 500; margin-top: 4px; }
.rule { height: 1px; background: var(--line); margin: 0 44px 18px 56px; }
.rule.r { margin: 0 56px 18px 44px; }

.folio { display: grid; grid-template-columns: 1fr 1fr; margin-top: 24px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.folio span:first-child { padding-left: 56px; }
.folio span:last-child { text-align: right; padding-right: 56px; }

/* vocabulary end page */
.vocab { padding: 0 56px; }
.vocab h3 { font-family: var(--f-display); font-weight: 600; font-size: calc(var(--fs) * 1.2); margin: 0 0 4px; }
.vocab p.sub { color: var(--muted); margin: 0 0 16px; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 28px; }
.vitem { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.vitem:hover .vca { color: var(--accent); }
.vca { font-size: calc(var(--fs) * .95); font-weight: 700; }
.ven { color: var(--muted); font-size: 15px; grid-column: 1; }
.vur { font-family: var(--f-ur); direction: rtl; font-size: 17px; line-height: 2; grid-column: 2; grid-row: 1 / span 2; text-align: right; }
.miss { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-style: italic; direction: ltr; }
.orig { background: var(--page); padding: 18px 56px 0; display: flex; flex-direction: column; gap: 6px; }
.orig h3 { font-family: var(--f-display); font-weight: 600; font-size: calc(var(--fs) * 1.2); margin: 0; }
.orig .sub { color: var(--muted); margin: 0 0 10px; max-width: 70ch; }
.orig label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-top: 8px; display: block; }
.orig textarea { width: 100%; font: inherit; font-size: 16px; line-height: 1.5; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
.orig textarea.urta { font-family: var(--f-ur); line-height: 2.1; }
.orig .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.orig .count { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.orig .count b { color: var(--ink); font-weight: 700; display: block; }
.orig details { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 12px; }
.orig summary { cursor: pointer; color: var(--accent); }
@media (max-width: 760px) { .orig { padding: 0 16px; } .orig .two { grid-template-columns: 1fr; } }
.drop { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px 16px; margin: 4px 0 2px; }
.drop.over { border-color: var(--accent); background: var(--mark-soft); }
.drop > div { flex: 1; min-width: 220px; display: flex; flex-direction: column; }
.drop span { color: var(--muted); font-size: 14px; }
.drop label.btn { margin: 0; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }
.review { border: 1px solid var(--line); border-radius: 10px; max-height: 360px; overflow-y: auto; margin-top: 8px; }
.rv { display: grid !important; grid-template-columns: auto 64px minmax(0,1fr); gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); margin: 0 !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 15px !important; color: var(--ink) !important; cursor: pointer; }
.rv:last-child { border-bottom: 0; }
.rv input[type=number] { width: 60px; font: inherit; font-size: 14px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.rvt { display: flex; flex-direction: column; min-width: 0; }
.rvt small { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linkb { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; text-decoration: underline; text-underline-offset: 3px; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.endnav { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }

/* ---------- Pager ---------- */
.pager { display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
.pager .navb { border: 1px solid var(--line); background: var(--page); border-radius: 999px; padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
.pager .navb:disabled { opacity: .4; cursor: default; }
.pager .navb svg { width: 16px; height: 16px; }
.progress { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 6px; }
.progress .track { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress .fill { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.progress small { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.legend { margin-top: 14px; color: var(--muted); font-size: 13px; display: flex; gap: 6px 18px; flex-wrap: wrap; }
.legend em { font-style: normal; text-decoration: underline dotted var(--accent) 2px; text-underline-offset: 4px; color: var(--ink); }

/* ---------- Word popover ---------- */
.pop { position: absolute; z-index: 40; width: min(340px, calc(100vw - 32px)); background: var(--page); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px 12px; }
.pop .head { display: flex; align-items: flex-start; gap: 10px; }
.pop .hw { font-family: var(--f-display); font-weight: 600; font-size: 24px; line-height: 1.2; }
.pop .pos { font-size: 12px; color: var(--muted); margin-top: 2px; }
.pop .form { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pop .tools { margin-left: auto; display: flex; gap: 6px; flex: none; }
.ibtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
.ibtn svg { width: 16px; height: 16px; }
.ibtn:hover { border-color: var(--accent); color: var(--accent); }
.ibtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pop dl { margin: 10px 0 0; display: grid; gap: 8px; }
.pop dt { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pop dd { margin: 1px 0 0; font-size: 16px; line-height: 1.4; }
.pop dd.ur { font-family: var(--f-ur); direction: rtl; text-align: right; font-size: 19px; line-height: 2.1; }
.pop .alt { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
.pop .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

/* ---------- Words drawer ---------- */
.drawer { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); background: var(--page); border-left: 1px solid var(--line); box-shadow: var(--shadow); padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) 18px; overflow-y: auto; }
.drawer h3 { font-family: var(--f-display); font-weight: 600; margin: 0; font-size: 20px; }
.drawer .dh { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.drawer p { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.drawer .vitem { grid-template-columns: 1fr auto auto; }
.drawer .vitem .ibtn { width: 28px; height: 28px; grid-row: 1 / span 2; grid-column: 3; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 16px; color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--page); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 50; }

/* ---------- Phone ---------- */
@media (max-width: 760px) {
  .spread { background: var(--page); padding-block: 22px 14px; min-height: 0; }
  .row { grid-template-columns: minmax(0,1fr); padding-block: 4px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .cell, .cell.tr { padding: 4px 16px 4px 50px; }
  .cell.tr { padding-top: 0; padding-bottom: 8px; }
  .tr .en { color: var(--muted); }
  .say { opacity: .8; left: 10px; top: 6px; }
  .row:hover .cell, .row.active .cell { box-shadow: none; }
  .chead { border-bottom: 0; }
  .chead .cell, .chead .cell.tr { padding-left: 16px; }
  .rule, .rule.r { display: none; }
  .chead .tr { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .folio { grid-template-columns: 1fr; padding: 0 16px; }
  .folio span:first-child { padding-left: 0; }
  .folio span:last-child { display: none; }
  .vocab { padding: 0 16px; }
  .pop.sheet { position: fixed; left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; border-radius: 16px 16px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand b { font-size: 18px; }
  .bar { position: static; }
  .ctl.spacer > .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand"><b id="bookTitle">L’illa del tresor</b><span id="bookSub">Robert Louis Stevenson · Lectura fàcil</span></div>
    <div class="controls">
      <div class="ctl"><label for="chap">Capítol · <i>Chapter</i></label><select id="chap"></select></div>
      <div class="ctl"><span class="lbl">Nivell · <i>Level</i></span>
        <div class="seg" id="lvl">
          <button type="button" data-v="facil">Fàcil</button>
          <button type="button" data-v="molt">Molt fàcil</button>
          <button type="button" data-v="original">Original</button>
        </div></div>
      <div class="ctl"><span class="lbl">Traducció · <i>Translation</i></span>
        <div class="seg" id="trl">
          <button type="button" data-v="en">English</button>
          <button type="button" data-v="ur"><span class="ur">اردو</span></button>
          <button type="button" data-v="both">Les dues</button>
        </div></div>
      <div class="ctl"><span class="lbl">Lletra · <i>Text</i></span>
        <div class="seg" id="fsz">
          <button type="button" data-d="-1" aria-label="Lletra més petita">A−</button>
          <button type="button" data-d="1" aria-label="Lletra més gran">A+</button>
        </div></div>
      <div class="ctl spacer"><span class="lbl">&nbsp;</span>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn" id="hideBtn" aria-pressed="false" title="Amaga la traducció per practicar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>Amaga</button>
          <button type="button" class="btn" id="wordsBtn" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Paraules <span id="wcount"></span></button>
        </div></div>
    </div>
  </div>
</header>

<main>
  <div class="book">
    <article class="spread" id="spread" aria-live="polite"></article>
    <nav class="pager" aria-label="Pàgines">
      <button type="button" class="navb" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Enrere</button>
      <div class="progress"><div class="track"><div class="fill" id="fill"></div></div><small id="ptext"></small></div>
      <button type="button" class="btn" id="readBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg><span>Escolta la pàgina</span></button>
      <button type="button" class="btn" id="rateBtn" aria-pressed="false" title="Veu més lenta">Lent</button>
      <button type="button" class="navb" id="next">Endavant<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </nav>
    <div class="legend">
      <span>Passa el ratolí per una frase: es marca l’original i la traducció.</span>
      <span>Clica una paraula per veure què vol dir.</span>
      <span><em>Paraula</em> = paraula important del capítol.</span>
    </div>
  </div>
</main>

<div class="pop" id="pop" hidden role="dialog" aria-label="Paraula"></div>
<aside class="drawer" id="drawer" hidden aria-label="Les meves paraules"></aside>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   DADES DEL LLIBRE
   Per afegir capítols: afegiu un objecte a BOOK.chapters amb
   el mateix format. Cada frase és [català, English, اردو].
   Cada paraula nova del text català ha de tenir entrada a DICT
   (clau = forma base; "f" = formes que apareixen al text).
   Nivell "Original": es pot enganxar des de l'app (es desa al
   navegador) o escriure aquí, dins de cada capítol:
   original: { ca: "text...", en: "text...", ur: "text..." }
   (les frases de les traduccions, en el mateix ordre).
   ============================================================ */
const BOOK = {"title": {"ca": "L’illa del tresor", "en": "Treasure Island", "ur": "خزانے کا جزیرہ"}, "author": "Robert Louis Stevenson", "chapters": [{"n": 1, "title": {"ca": "El vell mariner", "en": "The old sailor", "ur": "بوڑھا ملاح"}, "levels": {"facil": [[["Em dic Jim Hawkins.", "My name is Jim Hawkins.", "میرا نام جم ہاکنز ہے۔"], ["Ara us explicaré la història de l’illa del tresor.", "Now I will tell you the story of Treasure Island.", "اب میں آپ کو خزانے والے جزیرے کی کہانی سناؤں گا۔"], ["Tot va començar fa molts anys, quan jo era un nen.", "It all started many years ago, when I was a child.", "یہ سب بہت سال پہلے شروع ہوا، جب میں بچہ تھا۔"], ["Els meus pares tenien una posada a prop del mar.", "My parents had an inn near the sea.", "میرے والدین کی سمندر کے قریب ایک سرائے تھی۔"], ["La posada es deia Almirall Benbow.", "The inn was called the Admiral Benbow.", "سرائے کا نام ایڈمرل بینبو تھا۔"]], [["Un dia, un vell mariner va arribar a la posada.", "One day, an old sailor arrived at the inn.", "ایک دن، ایک بوڑھا ملاح سرائے میں آیا۔"], ["Era alt i fort, i tenia la pell fosca pel sol.", "He was tall and strong, and his skin was dark from the sun.", "وہ لمبا اور طاقتور تھا، اور دھوپ سے اس کی جلد سانولی تھی۔"], ["Tenia una cicatriu llarga a la cara.", "He had a long scar on his face.", "اس کے چہرے پر زخم کا ایک لمبا نشان تھا۔"], ["Portava un bagul gran i pesat.", "He carried a big, heavy chest.", "اس کے پاس ایک بڑا اور بھاری صندوق تھا۔"], ["Mentre caminava, cantava una cançó de pirates:", "As he walked, he sang a pirate song:", "چلتے ہوئے وہ قزاقوں کا ایک گانا گا رہا تھا:"], ["«Quinze homes sobre el bagul del mort, i una ampolla de rom!»", "“Fifteen men on the dead man’s chest, and a bottle of rum!”", "«مردے کے صندوق پر پندرہ آدمی، اور رم کی ایک بوتل!»"]], [["—M’agrada aquest lloc —va dir el mariner—. Hi ve molta gent?", "“I like this place,” said the sailor. “Do many people come here?”", "ملاح نے کہا: ”مجھے یہ جگہ پسند ہے۔ کیا یہاں بہت لوگ آتے ہیں؟“"], ["El meu pare li va dir que no, que hi venia poca gent.", "My father told him no, that few people came.", "میرے والد نے اسے بتایا کہ نہیں، یہاں کم لوگ آتے ہیں۔"], ["—Doncs em quedaré aquí —va dir—. Digueu-me capità.", "“Then I will stay here,” he said. “Call me Captain.”", "اس نے کہا: ”تو پھر میں یہیں رہوں گا۔ مجھے کپتان کہو۔“"], ["Va llançar unes monedes d’or sobre la taula.", "He threw some gold coins on the table.", "اس نے میز پر سونے کے کچھ سکے پھینکے۔"], ["Des d’aquell dia, tothom el va anomenar «el capità».", "From that day, everyone called him “the Captain”.", "اس دن سے سب اسے ”کپتان“ کہنے لگے۔"]], [["El capità parlava molt poc.", "The Captain spoke very little.", "کپتان بہت کم بولتا تھا۔"], ["Durant el dia caminava per la costa amb una ullera.", "During the day he walked along the coast with a telescope.", "دن میں وہ دوربین لے کر ساحل پر گھومتا تھا۔"], ["A la nit s’asseia a prop del foc i bevia rom.", "At night he sat near the fire and drank rum.", "رات کو وہ آگ کے پاس بیٹھ کر رم پیتا تھا۔"], ["Cada dia preguntava: «Heu vist cap mariner pel camí?»", "Every day he asked: “Have you seen any sailor on the road?”", "ہر روز وہ پوچھتا تھا: ”کیا تم نے راستے میں کوئی ملاح دیکھا ہے؟“"], ["Tenia por d’alguna cosa, però no sabíem de què.", "He was afraid of something, but we did not know what.", "وہ کسی چیز سے ڈرتا تھا، لیکن ہمیں معلوم نہیں تھا کہ کس چیز سے۔"]], [["Un dia, el capità em va cridar.", "One day, the Captain called me.", "ایک دن کپتان نے مجھے بلایا۔"], ["—Noi, vols guanyar diners? —em va preguntar.", "“Boy, do you want to earn money?” he asked me.", "اس نے مجھ سے پوچھا: ”لڑکے، کیا تم پیسے کمانا چاہتے ہو؟“"], ["—Cada mes et donaré una moneda de plata.", "“Every month I will give you a silver coin.”", "”میں تمہیں ہر مہینے چاندی کا ایک سکہ دوں گا۔“"], ["—Només has de vigilar si arriba un mariner amb una sola cama.", "“You only have to watch out for a sailor with only one leg.”", "”تمہیں بس یہ دیکھنا ہے کہ کہیں ایک ٹانگ والا ملاح تو نہیں آ رہا۔“"], ["—Si el veus, avisa’m de seguida.", "“If you see him, tell me at once.”", "”اگر تم اسے دیکھو تو فوراً مجھے بتانا۔“"]], [["Aquell mariner amb una sola cama em feia molta por.", "That sailor with only one leg scared me a lot.", "ایک ٹانگ والا وہ ملاح مجھے بہت ڈراتا تھا۔"], ["Les nits de tempesta, somiava amb ell.", "On stormy nights, I dreamed about him.", "طوفانی راتوں میں میں اس کے خواب دیکھتا تھا۔"], ["En els meus malsons, saltava i corria darrere meu.", "In my nightmares, he jumped and ran after me.", "میرے ڈراؤنے خوابوں میں وہ اچھلتا اور میرے پیچھے بھاگتا تھا۔"], ["Em despertava amb molta por.", "I woke up very scared.", "میں بہت ڈر کر جاگ جاتا تھا۔"]], [["Algunes nits, el capità bevia massa rom.", "Some nights, the Captain drank too much rum.", "کچھ راتوں کو کپتان بہت زیادہ رم پی لیتا تھا۔"], ["Llavors cantava cançons de mar amb una veu molt forta.", "Then he sang sea songs in a very loud voice.", "پھر وہ بہت اونچی آواز میں سمندری گانے گاتا تھا۔"], ["També explicava històries terribles de pirates, tempestes i baralles.", "He also told terrible stories of pirates, storms and fights.", "وہ قزاقوں، طوفانوں اور لڑائیوں کی خوفناک کہانیاں بھی سناتا تھا۔"], ["Tothom havia d’escoltar en silenci.", "Everyone had to listen in silence.", "سب کو خاموشی سے سننا پڑتا تھا۔"], ["Si algú parlava, el capità donava un cop fort a la taula.", "If someone spoke, the Captain banged hard on the table.", "اگر کوئی بولتا تو کپتان زور سے میز پر ہاتھ مارتا تھا۔"]], [["Van passar els mesos i el capità no pagava.", "The months went by and the Captain did not pay.", "مہینے گزرتے گئے اور کپتان پیسے نہیں دیتا تھا۔"], ["El meu pare estava malalt i tenia por de demanar-li els diners.", "My father was ill and was afraid to ask him for the money.", "میرے والد بیمار تھے اور اس سے پیسے مانگنے سے ڈرتے تھے۔"], ["Només una persona no tenia por del capità: el doctor Livesey.", "Only one person was not afraid of the Captain: Doctor Livesey.", "صرف ایک شخص کپتان سے نہیں ڈرتا تھا: ڈاکٹر لیوزی۔"], ["Una tarda, el doctor va venir a veure el meu pare.", "One afternoon, the doctor came to see my father.", "ایک دوپہر ڈاکٹر میرے والد کو دیکھنے آیا۔"]], [["El capità va començar a cantar la seva cançó i va picar la taula.", "The Captain began to sing his song and banged the table.", "کپتان نے اپنا گانا گانا شروع کیا اور میز پر ہاتھ مارا۔"], ["—Silenci! —va cridar.", "“Silence!” he shouted.", "وہ چلایا: ”خاموش!“"], ["El doctor el va mirar i va continuar parlant amb calma.", "The doctor looked at him and kept on talking calmly.", "ڈاکٹر نے اس کی طرف دیکھا اور سکون سے باتیں کرتا رہا۔"], ["Llavors el capità va treure un ganivet.", "Then the Captain took out a knife.", "تب کپتان نے ایک چاقو نکالا۔"]], [["—Guardeu aquest ganivet ara mateix —va dir el doctor—.", "“Put that knife away right now,” said the doctor.", "ڈاکٹر نے کہا: ”یہ چاقو ابھی واپس رکھو۔“"], ["—Sóc metge, però també sóc jutge.", "“I am a doctor, but I am also a judge.”", "”میں ڈاکٹر ہوں، لیکن میں جج بھی ہوں۔“"], ["—Si no em feu cas, us enviaré a la presó.", "“If you do not obey me, I will send you to prison.”", "”اگر تم نے میری بات نہ مانی تو میں تمہیں جیل بھیج دوں گا۔“"], ["El capità va guardar el ganivet i es va asseure, enfadat.", "The Captain put the knife away and sat down, angry.", "کپتان نے چاقو رکھ دیا اور غصے میں بیٹھ گیا۔"], ["Des d’aquella nit, el capità va estar més tranquil.", "From that night on, the Captain was calmer.", "اس رات کے بعد کپتان زیادہ پرسکون رہا۔"]]], "molt": [[["Em dic Jim.", "My name is Jim.", "میرا نام جم ہے۔"], ["Visc amb els meus pares en una posada.", "I live with my parents in an inn.", "میں اپنے والدین کے ساتھ ایک سرائے میں رہتا ہوں۔"], ["Una posada és una casa on la gent dorm i menja.", "An inn is a house where people sleep and eat.", "سرائے ایک گھر ہے جہاں لوگ سوتے اور کھاتے ہیں۔"], ["La posada és a prop del mar.", "The inn is near the sea.", "سرائے سمندر کے قریب ہے۔"]], [["Un dia arriba un mariner vell.", "One day an old sailor arrives.", "ایک دن ایک بوڑھا ملاح آتا ہے۔"], ["És alt i fort.", "He is tall and strong.", "وہ لمبا اور طاقتور ہے۔"], ["Té una cicatriu a la cara.", "He has a scar on his face.", "اس کے چہرے پر زخم کا نشان ہے۔"], ["Porta un bagul gran.", "He carries a big chest.", "اس کے پاس ایک بڑا صندوق ہے۔"], ["Canta una cançó de pirates.", "He sings a pirate song.", "وہ قزاقوں کا ایک گانا گاتا ہے۔"]], [["—Em quedo aquí —diu el mariner.", "“I am staying here,” says the sailor.", "ملاح کہتا ہے: ”میں یہیں رہوں گا۔“"], ["—Digueu-me capità.", "“Call me Captain.”", "”مجھے کپتان کہو۔“"], ["Paga amb monedes d’or.", "He pays with gold coins.", "وہ سونے کے سکوں سے پیسے دیتا ہے۔"], ["Ara tothom li diu «el capità».", "Now everyone calls him “the Captain”.", "اب سب اسے ”کپتان“ کہتے ہیں۔"]], [["El capità parla poc.", "The Captain talks very little.", "کپتان کم بولتا ہے۔"], ["De dia, mira el mar amb una ullera.", "By day, he looks at the sea with a telescope.", "دن میں وہ دوربین سے سمندر کو دیکھتا ہے۔"], ["De nit, beu rom a prop del foc.", "At night, he drinks rum near the fire.", "رات کو وہ آگ کے پاس رم پیتا ہے۔"], ["El capità té por.", "The Captain is afraid.", "کپتان ڈرا ہوا ہے۔"]], [["Un dia, el capità em parla.", "One day, the Captain talks to me.", "ایک دن کپتان مجھ سے بات کرتا ہے۔"], ["—Mira el camí cada dia.", "“Watch the road every day.”", "”ہر روز راستے پر نظر رکھو۔“"], ["—Si veus un mariner amb una sola cama, avisa’m.", "“If you see a sailor with only one leg, tell me.”", "”اگر تم ایک ٹانگ والا ملاح دیکھو تو مجھے بتانا۔“"], ["—Et pagaré una moneda cada mes.", "“I will pay you a coin every month.”", "”میں تمہیں ہر مہینے ایک سکہ دوں گا۔“"], ["Jo tinc por d’aquest mariner.", "I am afraid of this sailor.", "میں اس ملاح سے ڈرتا ہوں۔"]], [["A la nit, el capità beu molt.", "At night, the Captain drinks a lot.", "رات کو کپتان بہت پیتا ہے۔"], ["Canta fort i explica històries de pirates.", "He sings loudly and tells pirate stories.", "وہ اونچی آواز میں گاتا ہے اور قزاقوں کی کہانیاں سناتا ہے۔"], ["La gent de la posada té por.", "The people at the inn are afraid.", "س  not know any Bill.", "میں نے اسے بتایا کہ میں کسی بِل کو نہیں جانتا۔"], ["—És la taula d’un mariner que es diu capità —vaig dir.", "“It is the table of a sailor called the Captain,” I said.", "میں نے کہا: ”یہ ایک ملاح کی میز ہے جسے کپتان کہتے ہیں۔“"], ["—Té una cicatriu a la cara? —va preguntar—. Doncs és ell!", "“Does he have a scar on his face?” he asked. “Then it is him!”", "اس نے پوچھا: ”کیا اس کے چہرے پر نشان ہے؟ تو پھر وہی ہے!“"]], [["L’home va mirar per la porta, com un gat que espera un ratolí.", "The man looked out of the door, like a cat waiting for a mouse.", "آدمی نے دروازے سے باہر دیکھا، جیسے بلی چوہے کا انتظار کرتی ہے۔"], ["Després em va agafar del braç.", "Then he took me by the arm.", "پھر اس نے میرا بازو پکڑ لیا۔"], ["—Ens amagarem darrere la porta —va dir—. Li farem una sorpresa.", "“We will hide behind the door,” he said. “We will give him a surprise.”", "اس نے کہا: ”ہم دروازے کے پیچھے چھپیں گے۔ ہم اسے حیران کر دیں گے۔“"], ["Jo tremolava de por.", "I was trembling with fear.", "میں ڈر سے کانپ رہا تھا۔"], ["L’home tenia la mà a prop del ganivet.", "The man had his hand near his knife.", "آدمی کا ہاتھ چاقو کے قریب تھا۔"]], [["Per fi, el capità va entrar a la posada.", "At last, the Captain came into the inn.", "آخرکار کپتان سرائے میں داخل ہوا۔"], ["—Bill! —va cridar el desconegut.", "“Bill!” shouted the stranger.", "اجنبی چلایا: ”بِل!“"], ["El capità es va girar i es va posar blanc, com si veiés un fantasma.", "The Captain turned round and went white, as if he saw a ghost.", "کپتان مڑا اور اس کا رنگ سفید ہو گیا، جیسے اس نے کوئی بھوت دیکھ لیا ہو۔"], ["—Gos Negre! —va dir amb una veu tremolosa.", "“Black Dog!” he said in a shaking voice.", "اس نے کانپتی آواز میں کہا: ”بلیک ڈاگ!“"], ["—Sí, sóc jo, el teu vell company —va dir l’altre.", "“Yes, it’s me, your old shipmate,” said the other man.", "دوسرے آدمی نے کہا: ”ہاں، میں ہوں، تمہارا پرانا ساتھی۔“"]], [["—Què vols? —va preguntar el capità.", "“What do you want?” asked the Captain.", "کپتان نے پوچھا: ”   /* ============ book file import (EPUB, PDF, DOCX, HTML, TXT) — everything runs in the browser ============ */
  const LIB = {

  // HTML/XHTML document -> blocks [{t, h}]
  function htmlBlocks(markup, isXml) {
    let doc = new DOMParser().parseFromString(markup, isXml ? "application/xhtml+xml" : "text/html");
    if (doc.querySelector("parsererror")) doc = new DOMParser().parseFromString(markup, "text/html");
    const body = doc.body || doc.documentElement;
    body.querySelectorAll("script, style, table, aside, nav, figure, sup, [epub\\:type~='footnote'], [role='doc-footnote']").forEach(e => e.remove());

    const out = [];
    body.querySelectorAll(SEL).forEach(el => {
      if (el.querySelector(SEL)) return; // only innermost blocks
      const t = norm(el.textContent || ""); if (!t) return;
      const m = /^h([1-6])$/i.exec(el.tagName);
      out.push({ t, h: m ? +m[1] : 0 });

  async function readEpub(buf) {

    const opfPath = /full-path="([^"]+)"/.exec(container)[1];
    const base = opfPath.includes("/") ? opfPath.slice(0, opfPath.lastIndexOf("/") + 1) : "";
    const opf = new DOMParser().parseFromString(await zip.file(opfPath).async("string"), "application/xml");
    const items = {}; opf.querySelectorAll("manifest > item, item").forEach(i => items[i.getAttribute("id")] = i.getAttribute("href"));

    for (const ref of opf.querySelectorAll("spine > itemref, itemref")) {

      const f = zip.file(decodeURIComponent(base + href)) || zip.file(base + href); if (!f) continue;

  async function readDocx(buf) {

    const xml = new DOMParser().parseFromString(await zip.file("word/document.xml").async("string"), "application/xml");
    const out = [];
    for (const p of xml.getElementsByTagName("w:p")) {
      let t = "";
      for (const n of p.getElementsByTagName("*")) {
        if (n.tagName === "w:t") t += n.textContent; else if (n.tagName === "w:tab") t += " "; else if (n.tagName === "w:br") t += "\n";

  async function readPdf(buf) {

    const pdf = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
    const pagesLines = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const tc = await (await pdf.getPage(i)).getTextContent();
      const lines = []; let cur = "", size = 0, lastY = null;
      const push = () => { const t = norm(cur); if (t) lines.push({ t, size }); cur = ""; size = 0; };
      for (const it of tc.items) {
        const y = it.transform ? it.transform[5] : null;

  // blocks -> sections (chapters and other parts)
  function sectionize(blocks) {
    let chLevel = Math.min(...blocks.filter(b => b.h && CH_RE.test(b.t)).map(b => b.h));
    if (!isFinite(chLevel)) { // no headings: look for short lines that look like chapter titles

        seq = num;

    const maxW = Math.max(0, ...out.map(s => s.words));
    out.forEach((s, i) => s.sel = s.isCh && best[s.num] === i && (s.words >= 30 || maxW < 300));
    if (!out.some(s => s.sel) && out.length) { const big = out.reduce((a, b) => b.words > a.words ? b : a); big.sel = true; big.num = big.num || CH[S.ch].n; }

  let found = [];

  async function importFile(file) {
    if (!file) return;

    setStatus(`Llegint <b>${esc(file.name)}</b>…`); $("#oReview").innerHTML = "";

      found = sectionize(blocks);
      setStatus(`<b>${esc(file.name)}</b>: s’han trobat ${found.filter(s => s.isCh).length} capítols. Revisa la llista i tria quins vols afegir.`);
      drawReview();
    } catch (e) {
      console.error(e); setStatus(`<b>No s’ha pogut llegir el fitxer.</b> ${esc(e.message || "")}`);
    }
  }
  function drawReview() {
    const box = $("#oReview"); if (!box) return;
    box.innerHTML = `<div class="review">${found.map((s, i) => `
      <label class="rv"><input type="checkbox" data-rv="${i}" ${s.sel ? "checked" : ""}>
        <span class="rvn"><input type="number" min="1" max="999" value="${s.num || ""}" data-rvn="${i}" aria-label="Número de capítol" placeholder="núm."></span>
        <span class="rvt"><b>${esc(s.title)}</b><small>${s.words} paraules · ${esc(s.text.slice(0, 90))}…</small></span></label>`).join("")}</div>
      <div class="endnav"><button type="button" class="btn" aria-pressed="true" data-orig="addfound">Afegeix els capítols marcats</button></div>`;
  }
  function addFound() {
    const idx = LS.get("origIndex", {}); let n = 0, first = null;
    found.forEach(s => {
      if (!s.sel || !s.num) return;
      const prev = LS.get("orig:" + s.num, null) || {};
      LS.set("orig:" + s.num, { ca: s.text, en: prev.en || "", ur: prev.ur || "" });
      idx[s.num] = s.title; n++; if (first == null || s.num < first) first = s.num;
    });
    if (!n) { toast("Marca algun capítol i posa-hi el número."); return; }
    LS.set("origIndex", idx); refreshChapters(); fillChapterSelect();
    editing = false; found = []; S.lv = "original"; S.ch = Math.max(0, CH.findIndex(c => c.n === first)); S.page = 0;
    render(); toast(`Afegits ${n} capítols al nivell Original`);
  }
  document.addEventListener("change", e => {
    if (e.target.id === "oFile") { importFile(e.target.files[0]); e.target.value = ""; }
    else if (e.target.dataset.rv != null) found[+e.target.dataset.rv].sel = e.target.checked;
    else if (e.target.dataset.rvn != null) found[+e.target.dataset.rvn].num = +e.target.value || null;
  });
  document.addEventListener("dragover", e => { if (e.target.closest && e.target.closest("#drop")) { e.preventDefault(); $("#drop").classList.add("over"); } });
  document.addEventListener("dragleave", e => { if (e.target.closest && e.target.closest("#drop")) $("#drop").classList.remove("over"); });
  document.addEventListener("drop", e => { if (e.target.closest && e.target.closest("#drop")) { e.preventDefault(); $("#drop").classList.remove("over"); importFile(e.dataTransfer.files[0]); } });

  /* ---------- popover ---------- */
  const pop = $("#pop");
  let popAnchor = null;
  function entryHTML(k, form, first) {
    const e = DICT[k], hw = headword(k);
    const showForm = form && form.toLowerCase() !== (e.w || k).toLowerCase() && !/^nom propi/.test(e.p) && k !== "va";
    const isSaved = saved.includes(k);
    return `<div class="${first ? "" : "alt"}">
      <div class="head"><div><div class="hw" lang="ca">${esc(hw)}</div><div class="pos">${esc(e.p)}</div>${showForm ? `<div class="form">Al text: <b>${esc(form)}</b></div>` : ""}</div>
      ${first ? `<div class="tools"><button type="button" class="ibtn" data-say="${esc(e.w || k)}" aria-label="Escolta">${ICON.speak}</button><button type="button" class="ibtn" data-save="${k}" aria-pressed="${isSaved}" aria-label="Desa la paraula">${ICON.save}</button><button type="button" class="ibtn" data-close aria-label="Tanca">${ICON.close}</button></div>`
              : `<div class="tools"><button type="button" class="ibtn" data-save="${k}" aria-pressed="${isSaved}" aria-label="Desa la paraula">${ICON.save}</button></div>`}</div>
      <dl><div><dt>Què vol dir</dt><dd lang="ca">${esc(e.d)}</dd></div>
      <div><dt>English</dt><dd lang="en">${esc(e.en)}</dd></div>
      <div><dt>اردو · Urdu</dt><dd class="ur" lang="ur">${esc(e.ur)}</dd></div></dl></div>`;
  }
  function openPop(ks, form, anchor) {
    document.querySelectorAll(".w.on").forEach(w => w.classList.remove("on"));
    popAnchor = anchor || null;
    if (anchor && anchor.classList) anchor.classList.add("on");
    pop.innerHTML = ks.map((k, i) => entryHTML(k, form, i === 0)).join("") + (ks.length > 1 ? `<div class="note">Aquesta paraula té més d’un significat.</div>` : "");
    pop.hidden = false;
    place();
    const c = pop.querySelector("[data-close]"); if (c) c.focus({ preventScroll: true });
  }
  function place() {
    if (pop.hidden) return;
    const narrow = window.matchMedia("(max-width: 760px)").matches;
    pop.classList.toggle("sheet", narrow || !popAnchor);
    if (narrow || !popAnchor) { pop.style.left = ""; pop.style.top = ""; if (!narrow) { pop.style.position = "fixed"; pop.style.left = "50%"; pop.style.top = "20%"; pop.style.transform = "translateX(-50%)"; } return; }
    pop.style.position = ""; pop.style.transform = "";
    const r = popAnchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    let left = r.left + r.width / 2 - pw / 2 + scrollX;
    left = Math.max(scrollX + 16, Math.min(left, scrollX + innerWidth - pw - 16));
    let top = r.bottom + 10 + scrollY;
    if (r.bottom + ph + 20 > innerHeight && r.top - ph - 10 > 0) top = r.top - ph - 10 + scrollY;
    pop.style.left = left + "px"; pop.style.top = top + "px";
  }
  function closePop() {
    pop.hidden = true; popAnchor = null;
    document.querySelectorAll(".w.on").forEach(w => w.classList.remove("on"));
  }
  window.addEventListener("resize", place);

  /* ---------- saved words ---------- */
  function toggleSave(k) {
    const i = saved.indexOf(k);
    if (i >= 0) { saved.splice(i, 1); toast("Paraula treta"); } else { saved.push(k); toast("Paraula desada"); }
    LS.set("words", saved);
    document.querySelectorAll(`[data-save="${k}"]`).forEach(b => b.setAttribute("aria-pressed", saved.includes(k)));
    document.querySelectorAll(".w").forEach(w => w.classList.toggle("saved", w.dataset.ks.split("|").some(x => saved.includes(x))));
    $("#wcount").textContent = saved.length ? `(${saved.length})` : "";
    if (!$("#drawer").hidden) drawWords();
  }
  function drawWords() {
    const d = $("#drawer");
    d.innerHTML = `<div class="dh"><h3>Les meves paraules</h3><button type="button" class="ibtn" data-closedrawer aria-label="Tanca">${ICON.close}</button></div>
      <p>My words · <span lang="ur" style="font-family:var(--f-ur)">میرے الفاظ</span></p>
      ${saved.length ? saved.map(k => vitem(k, true)).join("") : `<div class="empty">Encara no has desat cap paraula. Clica una paraula del text i després el botó de desar.</div>`}`;
  }
  function toggleDrawer(force) {
    const d = $("#drawer"), open = force != null ? force : d.hidden;
    d.hidden = !open; $("#wordsBtn").setAttribute("aria-pressed", open);
    if (open) drawWords();
  }

  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

  /* ---------- navigation ---------- */
  function go(d) {
    const tot = pageCount();
    if (d > 0) {
      if (S.page < tot - 1) S.page++; else if (S.ch < CH.length - 1) { S.ch++; S.page = 0; } else return;
    } else {
      if (S.page > 0) S.page--; else if (S.ch > 0) { S.ch--; S.page = pageCount() - 1; } else return;
    }
    render(); window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  /* ---------- events ---------- */
  $("#bookTitle").textContent = BOOK.title.ca;
  function fillChapterSelect() { $("#chap").innerHTML = CH.map((c, i) => `<option value="${i}">${c.n}. ${esc(c.title.ca)}</option>`).join(""); $("#chap").value = S.ch; }
  fillChapterSelect();
  $("#chap").addEventListener("change", e => { S.ch = +e.target.value; S.page = 0; render(); });
  $("#lvl").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.dataset.v === S.lv) return;
    const ratio = S.page / Math.max(1, pageCount() - 1);
    S.lv = b.dataset.v; S.page = Math.round(ratio * (pageCount() - 1)); render();
  });
  $("#trl").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.tr = b.dataset.v; render(); } });
  $("#fsz").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.fs = Math.max(16, Math.min(32, S.fs + 2 * b.dataset.d)); render(); } });
  $("#hideBtn").addEventListener("click", () => { S.hide = !S.hide; render(); });
  $("#rateBtn").addEventListener("click", () => { S.slow = !S.slow; $("#rateBtn").setAttribute("aria-pressed", S.slow); save(); });
  $("#wordsBtn").addEventListener("click", () => toggleDrawer());
  $("#readBtn").addEventListener("click", readPage);
  $("#prev").addEventListener("click", () => go(-1));
  $("#next").addEventListener("click", () => go(1));

  document.addEventListener("click", e => {
    const t = e.target;
    const w = t.closest(".w");
    if (w) { e.stopPropagation(); const row = w.closest(".row"); setActive(row); openPop(w.dataset.ks.split("|"), w.dataset.form, w); return; }
    const say = t.closest(".say");
    if (say) { const row = say.closest(".row"); setActive(row); if (synth) synth.cancel(); speak(row.dataset.ca, "ca"); return; }
    const ds = t.closest("[data-say]"); if (ds) { if (synth) synth.cancel(); speak(ds.dataset.say, "ca"); return; }
    const sv = t.closest("[data-save]"); if (sv) { toggleSave(sv.dataset.save); return; }
    if (t.closest("[data-close]")) { const a = popAnchor; closePop(); if (a && a.focus) a.focus(); return; }
    if (t.closest("[data-closedrawer]")) { toggleDrawer(false); return; }
    const rm = t.closest("[data-rm]"); if (rm) { e.stopPropagation(); toggleSave(rm.dataset.rm); return; }
    const vi = t.closest(".vitem"); if (vi) { openPop([vi.dataset.k], null, vi); return; }
    const g = t.closest("[data-go]"); if (g) { if (g.dataset.go === "restart") S.page = 0; else if (g.dataset.go === "edit") { editing = true; S.page = 0; } else { S.ch++; S.page = 0; } render(); scrollTo(0, 0); return; }
    const oa = t.closest("[data-orig]"); if (oa) { origAction(oa.dataset.orig); return; }
    if (t.closest(".orig")) return;
    if (pop.contains(t)) return;
    closePop();
    const row = t.closest(".row[data-i]"); setActive(row);
  });
  function setActive(row) {
    document.querySelectorAll(".row.active").forEach(r => { if (r !== row) r.classList.remove("active"); });
    if (row) row.classList.add("active");
  }
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (!pop.hidden) { const a = popAnchor; closePop(); if (a && a.focus) a.focus(); } else if (!$("#drawer").hidden) toggleDrawer(false); return; }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".w, .vitem")) { e.preventDefault(); e.target.click(); return; }
    if (e.target.matches("input, select, textarea")) return;
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });
  // touch swipe between pages
  let tx = null, ty = null;
  $("#spread").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $("#spread").addEventListener("touchend", e => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  render();
})();
</script>
